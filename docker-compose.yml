# Local dev infrastructure (v3, phases 16–17).
#
# The docs' local-dev decision names "Docker Compose + MinIO + LocalStack" —
# phases 16–17 add Postgres (accounts) and the upload worker (brand kits).
# MinIO and LocalStack land with storage/KMS (v3-later).
#
# ponytail: Postgres + the worker only. The compose file grows when storage
# and KMS paths arrive; a service that exists but is unused is worse than one
# that lands with its first consumer.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ddesign
      POSTGRES_USER: ddesign
      POSTGRES_PASSWORD: ddesign
    ports:
      - '5432:5432'
    volumes:
      - ddesign_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ddesign -d ddesign']
      interval: 2s
      timeout: 3s
      retries: 15

  # The upload worker: the isolated process that parses hostile bytes and has
  # nothing to steal (security/README.md trust boundaries). No database, no
  # sessions, no VPC route. web forwards brand-asset uploads here; the worker
  # verifies magic bytes, re-encodes/sanitizes, and hands the safe bytes back.
  worker:
    build: ./worker
    ports:
      - '8080:8080'
    environment:
      PORT: 8080

volumes:
  ddesign_pgdata:
