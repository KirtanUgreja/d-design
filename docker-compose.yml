# Local dev infrastructure (v3, phases 16–18).
#
# The docs' local-dev decision names "Docker Compose + MinIO + LocalStack".
# Phases 16–18 add Postgres (accounts), the upload worker (brand kits), MinIO
# (S3 — LocalStack is out: its 2026 licensing put S3 behind the paid Pro tier,
# and MinIO speaks the same S3 protocol) and render as a service.
# LocalStack itself still lands with KMS/Secrets when those paths arrive.
#
# ponytail: the whole product, not a subset — Postgres, MinIO + its bucket
# bootstrap, worker, render, api, web. The compose file grows when KMS arrives;
# a service that exists but is unused is worse than one that lands with its
# first consumer.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ddesign
      POSTGRES_USER: ddesign
      POSTGRES_PASSWORD: ddesign
    ports:
      - '5432:5432'
    volumes:
      - ddesign_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ddesign -d ddesign']
      interval: 2s
      timeout: 3s
      retries: 15

  # The upload worker: the isolated process that parses hostile bytes and has
  # nothing to steal (security/README.md trust boundaries). No database, no
  # sessions, no VPC route. web forwards brand-asset uploads here; the worker
  # verifies magic bytes, re-encodes/sanitizes, and hands the safe bytes back.
  worker:
    build: ./worker
    ports:
      - '8080:8080'
    environment:
      PORT: 8080

  # MinIO — the local S3 (same protocol as real S3; storage.ts points its
  # endpoint here in dev and at real S3 in prod — one code path).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ddesign
      MINIO_ROOT_PASSWORD: ddesignpass
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ddesign_minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 3s
      retries: 15

  # The bucket, created and made publicly readable on every `up`. One-shot:
  # it configures MinIO and exits.
  #
  # Without this the published URL 403s. storage.put sets
  # `Cache-Control: public, max-age=31536000, immutable` and the hosted page IS
  # the file, so a private bucket means publish returns 201 and hands back a
  # link nobody can open. Prod relies on the real bucket policy; this is the
  # local spelling of the same fact.
  #
  # ponytail: a throwaway `minio/minio` container running `mc` — that image
  # already ships it (the healthcheck above uses it), where `minio/mc` is no
  # longer pullable under its old name.
  createbucket:
    image: minio/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set download "local/$$S3_BUCKET"
    environment:
      MINIO_ROOT_USER: ddesign
      MINIO_ROOT_PASSWORD: ddesignpass
      S3_BUCKET: ddesign-assets

  # render as a service — the documented contract (backend.md: "one endpoint,
  # in a validated Deck plus a DesignFamily, out HTML. No database, no model
  # credentials, no auth."). web calls it to turn a deck into the single-file
  # HTML before publishing; the hosted page itself is pure S3 bytes.
  # Build context is the repo root: render bundles web/src (the @web alias).
  render:
    build:
      context: .
      dockerfile: render/Dockerfile
    ports:
      - '8001:8001'
    environment:
      PORT: 8001

  # The api service — the app tables (phases 16-19) and the generation stages,
  # which put the v1 pipeline on the product surface. OPENROUTER_API_KEY is
  # passed through from the environment (the repo-root .env holds it); without
  # it the generation routes answer 503 and refuse, which is the fail-closed
  # behaviour, not a fallback.
  #
  # api's migrations are not run here: `uv run alembic upgrade head` owns the
  # schema (the migration role owns DDL; the app role never does).
  api:
    build: ./api
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgresql+asyncpg://ddesign:ddesign@postgres:5432/ddesign
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  # The web app — the editor and the browser-facing API surface.
  #
  # The only service with a secret. The default here is a DEV value, matching
  # the dev credentials above it (ddesignpass), so `docker compose up -d` works
  # on a fresh clone. It signs sessions, so a real deployment must supply its
  # own — and a deployment that forgets gets sessions signed with a published
  # string, which is why the value is called out rather than tucked away.
  web:
    build: ./web
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://ddesign:ddesign@postgres:5432/ddesign
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-local-secret-for-tests}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # Service names, not localhost: inside the compose network the app
      # reaches its neighbours by name.
      DDESIGN_API_URL: http://api:8000
      RENDER_URL: http://render:8001
      HOSTED_ORIGIN: ${HOSTED_ORIGIN:-http://localhost:9000/ddesign-assets}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ddesign-assets
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-ddesign}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-ddesignpass}
    depends_on:
      - api
      - render
      - minio

volumes:
  ddesign_pgdata:
  ddesign_minio:
