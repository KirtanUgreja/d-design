# The local environment: the real database and real object storage, offline.
#
# MinIO from day one is deliberate. `storage.py` is the only abstraction in the
# project with a planned second implementation, and pointing it at the S3 API
# locally means it ends up with one implementation after all. MinIO is not a
# mock — it speaks the same protocol. LocalStack waits for v3; there are no
# integration credentials to encrypt yet.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ddesign
    ports:
      - '5432:5432'
    volumes:
      - ./api/migrations/roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      # Postgres 18 wants the whole directory, not the `data` subdirectory —
      # a single mount here is what lets `pg_upgrade --link` work later.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ddesign']
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 3s
      retries: 20

  # One-shot. The bucket has to exist before storage.py writes to it, and
  # creating it in application code would be the app provisioning its own
  # infrastructure — which is exactly what it must not do in production.
  createbucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/d-design &&
      echo bucket ready"

  # v2 phase 00. The renderer plus Playwright, in one process, because Python
  # cannot server-side-render React (docs/techstack/backend.md). A *language*
  # boundary, not a security one — `render` is not the fetch worker and must
  # never become it: a schema-validated scene tree carrying no presentational
  # values is trusted input, where that container renders attackers' pages.
  render:
    build:
      # The repo root, because the image needs `render/dist`, which is built
      # from `web/src`. A `render/`-scoped context could not see the renderer
      # it exists to run.
      context: .
      dockerfile: render/Dockerfile
    # **No `environment:` block, and that absence is the control.** No
    # DATABASE_URL, no S3 key, no model key — the trust split is the whole
    # reason it is safe to run a browser next to this application, and
    # `assertNoCredentials` refuses to start if one appears anyway.
    #
    # **No `ports:` either.** `jobs` calls this over the compose network; a
    # browser-driving service reachable from the host is a browser-driving
    # service reachable from anything on the host.
    expose:
      - '3200'
    # Chromium's default /dev/shm is 64MB in a container and a large viewport
    # exhausts it — the crash reads as a mysterious page close. The browser
    # also passes `--disable-dev-shm-usage`; this is the other half.
    shm_size: '512mb'
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
