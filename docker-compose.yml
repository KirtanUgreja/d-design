# The local environment: the real database and real object storage, offline.
#
# The `render` service was removed on 2026-08-10 with the codebase; it built
# from `web/src`, which no longer exists. Postgres and MinIO are generic and
# stay. See git history for the service definition when a renderer returns.
#
# MinIO from day one is deliberate. `storage.py` is the only abstraction in the
# project with a planned second implementation, and pointing it at the S3 API
# locally means it ends up with one implementation after all. MinIO is not a
# mock — it speaks the same protocol. LocalStack waits for v3; there are no
# integration credentials to encrypt yet.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ddesign
    ports:
      - '5432:5432'
    volumes:
      # ponytail: the roles.sql init mount was removed with the codebase on
      # 2026-08-10. Restore it when migrations exist again — RLS needs the
      # roles to be created before the first connection, not after.
      # Postgres 18 wants the whole directory, not the `data` subdirectory —
      # a single mount here is what lets `pg_upgrade --link` work later.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ddesign']
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 3s
      retries: 20

  # One-shot. The bucket has to exist before storage.py writes to it, and
  # creating it in application code would be the app provisioning its own
  # infrastructure — which is exactly what it must not do in production.
  createbucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/d-design &&
      echo bucket ready"

volumes:
  pgdata:
  miniodata:
