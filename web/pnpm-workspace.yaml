# Supply-chain configuration. pnpm 11 turns both defences from
# docs/coderules/dependencies.md on by default; this file is where the two
# places they can be widened live, so a widening is a reviewable diff.

# The release-age gate is 1440 minutes by default. `strict` is the part that is
# NOT default and is the part that matters: without it, pinning a version
# published in the last day silently appends it to a minimumReleaseAgeExclude
# list and the gate is gone for that package.
# Verified 4 Aug 2026 — typescript-eslint 8.66.0, published <24h earlier, was
# auto-excluded on first install. Pinned back to 8.65.0 rather than kept.
minimumReleaseAgeStrict: true

# Packages permitted to run lifecycle scripts at install time. This is what the
# Shai-Hulud worm actually used, so every name here is a decision that this
# package may execute code on your machine.
#
#   sharp          — arrives on purpose in phase 10, for image re-encode and
#                    EXIF strip. Next.js pulls it in as an optional image
#                    optimizer; nothing in v1 optimizes an image.
#   unrs-resolver  — native resolver for eslint's import plugin. It has a JS
#                    fallback and lint runs without the binary.
allowBuilds:
  sharp: false
  unrs-resolver: false
