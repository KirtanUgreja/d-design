html, body { margin: 0; height: 100%; overflow: hidden; background: var(--c-ground); }
#dd-stage { position: fixed; inset: 0; }
.dd-slide {
  width: 1920px; height: 1080px; position: absolute; left: 50%; top: 50%;

.dd-slide.on { display: block; }

/* O: every slide at a fifth of its size; click one to go there. */
body.dd-overview #dd-stage {

  gap: 24px; padding: 32px; justify-content: center; align-content: start;

/* B: black screen. */
body.dd-black { background: #000; }
body.dd-black #dd-stage { visibility: hidden; }

/* The chrome: the counter and the AI disclosure, shown when the mouse moves
   and always in the overview. Never on a slide, never in print. */
#dd-chrome {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between;
  padding: 10px 16px; font: 13px/1.2 system-ui, sans-serif; color: var(--c-ink-2);
  background: var(--c-ground); opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
}
body.dd-awake #dd-chrome, body.dd-overview #dd-chrome { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #dd-chrome { transition: none; } }

@media print {
  @page { size: 1920px 1080px; margin: 0; }
  html, body { height: auto; overflow: visible; }
  #dd-stage { position: static; }
  .dd-slide { display: block; position: relative; left: auto; top: auto; transform: none; break-after: page; }
  #dd-chrome { display: none; }
}

</section></template></div></main><footer id="dd-chrome"><span id="dd-count"></span><span>Made with AI · d-design</span></footer><script type="application/json" id="dd-notes">{"s01": "Thanks for joining us. Today we're launching Tessel 2, and the idea behind it is simple. Your notes should be there when you need them, whether you have a signal or not. Tessel 2 works fully offline, and your devices sync directly with each other. We'll walk through why we built it, what's new, and then show you a live demo. By the end, we think you'll see why connectivity shouldn't decide whether you can get your thinking done.", "s02": "Let's start with the problem, because nearly everyone has lived it. TeamViewer's 2025 research found that 88 percent of respondents had connectivity problems in the last year. That's almost everybody. Think about the train tunnel, the hotel wifi that never quite works, the conference room where the network drops mid-meeting. Each of those is a moment when your notes are stuck behind a connection you can't control. That's the gap we set out to close.", "s03": "And this isn't a niche concern. North America Market Reports estimated in 2024 that more than 120 million Americans regularly use note-taking apps, whether for work, study or personal productivity. For these people, notes aren't an occasional tool, they're something opened every single day. When a tool is that central, a dropped connection isn't a small annoyance. It interrupts the routine itself. So reliability matters most in exactly the place where we're focused.", "s04": "So here's what's new. In Tessel 2, every note opens, edits and saves without a connection. No signal needed, and no waiting on a server to respond before you can type. What we care about most is the third point: it's the same app and the same speed. You don't switch into some stripped-down offline mode or learn anything new. You open Tessel, and it works, the same way it always does. The connection simply stops being a factor.", "s05": "The second piece is sync. Working offline only helps if your devices can still agree with each other afterwards. In Tessel 2 they sync directly, peer to peer, device to device, with no round trip through a distant server required. When devices meet, the changes merge. So you can edit on your laptop on a flight, edit on your phone in a taxi, and when the two find each other, everything comes together. That's the part we're most excited to show you next.", "s06": "Now let's see it for real. We'll switch the network off first, and you'll see that our notes still open as normal. Then we'll make an edit on one device, and a different edit on a second device. Finally, we'll bring the devices together and watch the changes sync to each other, with no network involved. Keep an eye on the screen as the two versions merge, because that's the whole promise of Tessel 2 happening live in front of you.", "s07": "Here's the good news on availability. If you already use Tessel, you can upgrade to Tessel 2 right now. There's no waiting list and nothing to set up from scratch, and your existing notes come along with you. We wanted the move to be as easy as possible, because the whole point is removing friction from your day. If you've ever been cut off from your notes, this is the upgrade built for that moment.", "s08": "So here's what we'd ask of you. If you're a Tessel user, upgrade to Tessel 2 today and see what it feels like to stop thinking about your connection. If you're in the press, we'd love for you to tell the offline story, because it's one almost every reader has experienced firsthand. We're glad to set up demos and answer any questions. Thank you for your time, and let's take questions now."}</script><script>// The player: ours, static, allowed by its hash in the export's CSP
// (docs/v4/plan/26-player-export.md). Slides are Declarative Shadow DOM roots
// written by the engine; nothing here builds markup from deck content except
// the presenter popup, which mirrors those same sanitized roots.
(() => {
  const d = document;
  const slides = [...d.querySelectorAll(".dd-slide")];
  const n = slides.length;
  if (!n) return;
  const body = d.body;
  const count = d.getElementById("dd-count");
  const notesBlock = d.getElementById("dd-notes");
  const notes = notesBlock ? JSON.parse(notesBlock.textContent || "{}") : {};
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const motion = reduced ? "still" : body.dataset.motion || "subtle";
  const ms = { still: 0, subtle: 260, confident: 420 }[motion] || 0;
  let i = 0, step = 0, typed = "", popup = null, started = 0, timer = 0, idle = 0;

  // --- builds: data-build="1..n" fields reveal in steps ----------------------
  const builds = (s) => (s.shadowRoot ? [...s.shadowRoot.querySelectorAll("[data-build]")] : []);
  const steps = (s) => builds(s).reduce((m, e) => Math.max(m, +e.dataset.build || 0), 0);
  const paint = (s, k) => {
    for (const e of builds(s)) {
      const on = (+e.dataset.build || 0) <= k;
      e.style.transition = ms ? `opacity ${ms}ms ease, transform ${ms}ms ease` : "";
      e.style.opacity = on ? "" : "0";
      e.style.transform = on || motion !== "confident" ? "" : "translateY(24px)";
    }
  };
  const revealAll = () => slides.forEach((s) => paint(s, Infinity));

  // --- the stage ------------------------------------------------------------
  const fit = () => {
    const k = Math.min(innerWidth / 1920, innerHeight / 1080);
    d.documentElement.style.setProperty("--dd-k", String(k));
    if (popup && !popup.closed) sizeMinis();
  };
  const show = (to, at) => {
    i = Math.max(0, Math.min(n - 1, to));
    step = at === undefined ? 0 : at;
    slides.forEach((s, j) => s.classList.toggle("on", j === i));
    paint(slides[i], step);
    if (location.hash !== `#${i + 1}`) history.replaceState(null, "", `#${i + 1}`);
    count.textContent = `${i + 1} / ${n}`;
    sync();
  };
  const next = () => {
    if (step < steps(slides[i])) { step += 1; paint(slides[i], step); sync(); }
    else if (i < n - 1) show(i + 1, 0);
  };
  const prev = () => {
    if (step > 0) { step -= 1; paint(slides[i], step); sync(); }
    else if (i > 0) show(i - 1, steps(slides[i - 1]));
  };
  const fromHash = () => {
    const k = parseInt(location.hash.slice(1), 10);
    if (k >= 1 && k <= n && k - 1 !== i) show(k - 1, 0);
  };
  const overview = (on) => {
    body.classList.toggle("dd-overview", on);
    if (on) slides[i].scrollIntoView({ block: "center" });
  };
  const wake = () => {
    body.classList.add("dd-awake");
    clearTimeout(idle);
    idle = setTimeout(() => body.classList.remove("dd-awake"), 2200);
  };

  // --- keys, from the deck window or the presenter popup -----------------------
  const onKey = (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (/^[0-9]$/.test(k)) { typed += k; return; }
    if (k === "Enter" && typed) {
      show(parseInt(typed, 10) - 1, 0);
      typed = "";
      overview(false);
      e.preventDefault();
      return;
    }
    typed = "";
    if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(k)) next();
    else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(k)) prev();
    else if (k === "Home") show(0, 0);
    else if (k === "End") show(n - 1, steps(slides[n - 1]));
    else if (k === "f" || k === "F") {
      if (d.fullscreenElement) d.exitFullscreen(); else d.documentElement.requestFullscreen();
    } else if (k === "o" || k === "O") overview(!body.classList.contains("dd-overview"));
    else if (k === "b" || k === "B" || k === ".") body.classList.toggle("dd-black");
    else if (k === "p" || k === "P") presenter();
    else if (k === "Escape") { typed = ""; overview(false); body.classList.remove("dd-black"); }
    else return;
    e.preventDefault();
  };

  // --- the presenter popup ----------------------------------------------------
  // A blank popup inherits this file's origin, so the deck writes into it
  // directly; a BroadcastChannel is unreliable between file:// pages.
  const pad = (v) => String(v).padStart(2, "0");
  const mini = (target, s) => {
    target.textContent = "";
    if (!s || !s.shadowRoot) return;
    const host = popup.document.createElement("div");
    host.className = "dd-mini";
    host.attachShadow({ mode: "open" }).innerHTML = s.shadowRoot.innerHTML;
    target.appendChild(host);
  };
  const sizeMinis = () => {
    for (const box of popup.document.querySelectorAll(".p-frame")) {
      const m = box.querySelector(".dd-mini");
      if (m) m.style.transform = `scale(${box.clientWidth / 1920})`;
    }
  };
  const tick = () => {
    if (!popup || popup.closed) { clearInterval(timer); return; }
    const s = Math.floor((Date.now() - started) / 1000);
    const now = new Date();
    popup.document.getElementById("p-timer").textContent = `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
    popup.document.getElementById("p-clock").textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  };
  function sync() {
    if (!popup || popup.closed) return;
    const pd = popup.document;
    mini(pd.getElementById("p-cur"), slides[i]);
    mini(pd.getElementById("p-next"), slides[i + 1]);
    pd.getElementById("p-notes").textContent = notes[slides[i].dataset.slide] || "";
    pd.getElementById("p-count").textContent = `${i + 1} / ${n}` + (steps(slides[i]) ? ` · step ${step}/${steps(slides[i])}` : "");
    sizeMinis();
  }
  function presenter() {
    if (popup && !popup.closed) { popup.focus(); return; }
    popup = window.open("", "dd-presenter", "width=1280,height=800");
    if (!popup) return;
    const pd = popup.document;
    pd.title = `Presenter · ${d.title}`;
    const style = pd.createElement("style");
    style.textContent = d.getElementById("dd-theme").textContent + d.getElementById("dd-presenter-css").textContent;
    pd.head.appendChild(style);
    for (const id of ["p-cur", "p-next", "p-notes", "p-bar"]) {
      const el = pd.createElement("div");
      el.id = id;
      if (id !== "p-notes" && id !== "p-bar") el.className = "p-frame";
      pd.body.appendChild(el);
    }
    for (const id of ["p-timer", "p-clock", "p-count"]) {
      const el = pd.createElement("span");
      el.id = id;
      pd.getElementById("p-bar").appendChild(el);
    }
    popup.addEventListener("keydown", onKey);
    popup.addEventListener("resize", sizeMinis);
    started = Date.now();
    clearInterval(timer);
    timer = setInterval(tick, 1000);
    tick();
    sync();
  }

  // --- wiring -----------------------------------------------------------------
  addEventListener("keydown", onKey);
  addEventListener("resize", fit);
  addEventListener("hashchange", fromHash);
  addEventListener("mousemove", wake);
  addEventListener("beforeprint", revealAll);
  addEventListener("afterprint", () => show(i, step));
  d.getElementById("dd-stage").addEventListener("click", (e) => {
    const host = e.target.closest ? e.target.closest(".dd-slide") : null;
    if (body.classList.contains("dd-overview")) {
      if (host) { show(slides.indexOf(host), 0); overview(false); }
      return;
    }
    if (e.clientX < innerWidth / 3) prev(); else next();
  });
  let x0 = null;
  addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  addEventListener("touchend", (e) => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    x0 = null;
    if (Math.abs(dx) > 50) { if (dx < 0) next(); else prev(); }
  });
  window.ddPlayer = { revealAll };
  fit();
  show((parseInt(location.hash.slice(1), 10) || 1) - 1, 0);
})();
</script></body></html>
