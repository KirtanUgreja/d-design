<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora Roasters</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'; connect-src 'none';">
<style>
:root {
--dds-font-display: 'Source Serif 4', Georgia, serif;
--dds-font-body: 'Source Serif 4', Georgia, serif;
--dds-radius: 0px;
--dds-space: 8px;
--dds-ink: #1a1a18;
--dds-paper: #faf7f2;
--dds-accent: #8a2b16;
--dds-texture: paper;
}
/* The renderer's stylesheet — the design family is the only styling.
 *
 * patterns.md rule 1 seen from the renderer side: the model emits *what* is on
 * the slide; these rules apply *how it looks* from the family tokens. No
 * Tailwind, no inline hex — the CSS custom properties in tokens.ts are the
 * single source of visual truth.
 *
 * Progressive enhancement (frontend.md): the markup is complete without JS.
 * Reveals are a class-level enhancement that starts from the resting state.
 */

.dds-deck {
  display: flex;
  flex-direction: column;
  font-family: var(--dds-font-body);
  color: var(--dds-ink);
  background: var(--dds-paper);
  line-height: 1.5;
}

.dds-slide {
  min-height: 100vh;
  padding: clamp(2rem, 6vw, 5rem);
  box-sizing: border-box;
  display: flex;
  align-items: center;
}

.dds-slide__inner {
  max-width: 64rem;
  width: 100%;
  margin: 0 auto;
}

/* --- typography -------------------------------------------------------- */

.dds-text {
  display: block;
}

.dds-text--headline {
  font-family: var(--dds-font-display);
  font-size: clamp(2.5rem, 6vw, 5rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.05;
  margin: 0 0 1.5rem;
}

.dds-text--eyebrow {
  font-family: var(--dds-font-display);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-size: 0.85rem;
  margin-bottom: 1.25rem;
  opacity: 0.7;
}

.dds-text--body {
  font-size: clamp(1.1rem, 1.6vw, 1.4rem);
  max-width: 42rem;
}

.dds-text--caption {
  font-size: 0.9rem;
  opacity: 0.6;
}

/* --- blocks ------------------------------------------------------------ */

.dds-stat {
  display: inline-flex;
  flex-direction: column;
  margin-right: 2.5rem;
}

.dds-stat__value {
  font-family: var(--dds-font-display);
  font-size: clamp(2.5rem, 5vw, 4rem);
  font-weight: 700;
  line-height: 1;
}

.dds-stat__label {
  font-size: 0.9rem;
  opacity: 0.65;
}

.dds-quote {
  display: block;
  font-family: var(--dds-font-display);
  font-size: clamp(1.6rem, 3.5vw, 2.6rem);
  font-style: italic;
  max-width: 46rem;
}

.dds-quote__attr {
  display: block;
  font-style: normal;
  font-size: 1rem;
  opacity: 0.6;
  margin-top: 1rem;
}

.dds-chart__title {
  font-family: var(--dds-font-display);
  font-size: 1.25rem;
  font-weight: 600;
  margin-bottom: 1.25rem;
  display: block;
}

.dds-chart svg {
  width: 100%;
  height: auto;
  display: block;
  color: var(--dds-ink);
}

.dds-chart svg text {
  font-family: var(--dds-font-body);
}

.dds-image {
  display: block;
}

.dds-image img {
  max-width: 100%;
  height: auto;
  display: block;
}

.dds-image--hero img,
.dds-image--background img {
  width: 100%;
  object-fit: cover;
}

.dds-image__placeholder {
  display: block;
  padding: 3rem;
  border: 1px dashed color-mix(in srgb, var(--dds-ink) 40%, transparent);
  opacity: 0.6;
}

.dds-cta {
  display: inline-block;
  margin-top: 2rem;
  padding: 0.8rem 1.75rem;
  background: var(--dds-accent);
  color: var(--dds-paper);
  text-decoration: none;
  font-weight: 600;
}

/* --- layout regions (phase 10) ----------------------------------------- */

/* The slide's generated layout is a sequence of regions; the renderer maps
 * role/span/emphasis to a 12-column grid. The model never emits a length —
 * the spans are relative relationships, sized here by the family tokens. */

.dds-slide__inner {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: clamp(1rem, 2.5vw, 2rem);
  align-items: start;
}

.dds-region {
  min-width: 0;
}

.dds-region[data-span='full'] {
  grid-column: 1 / -1;
}

.dds-region[data-span='two-thirds'] {
  grid-column: span 8;
}

.dds-region[data-span='half'] {
  grid-column: span 6;
}

.dds-region[data-span='third'] {
  grid-column: span 4;
}

.dds-region[data-span='quarter'] {
  grid-column: span 3;
}

.dds-region[data-emphasis='quiet'] {
  opacity: 0.7;
}

.dds-region[data-emphasis='primary'] .dds-text--headline {
  font-size: clamp(3rem, 7vw, 6rem);
}

.dds-region[data-role='aside'] {
  opacity: 0.7;
}

/* --- texture (per family, set via data-family) -------------------------- */

.dds-deck[data-family] {
  /* families set these via tokens.ts; texture is applied here */
}

.dds-deck[data-family='brutalist-stencil'] .dds-text--headline {
  text-transform: uppercase;
}

.dds-deck[data-family='neo-noir'] .dds-slide {
  border-top: 1px solid color-mix(in srgb, var(--dds-ink) 20%, transparent);
}

.dds-deck[data-family='scientific'] .dds-stat__value::after,
.dds-deck[data-family='tech-minimal'] .dds-stat__value::after {
  content: '';
  display: block;
  width: 2.5rem;
  height: 3px;
  background: var(--dds-accent);
  margin-top: 0.5rem;
}

.dds-deck[data-family='vivid-flat'] .dds-slide {
  background: var(--dds-paper);
}

/* Reveal is an enhancement; the resting state is fully visible. */
.dds-deck[data-motion='none'] [data-reveal] {
  opacity: 1;
}

/* --- the footer (phase 18) ---------------------------------------------
 * One mark, two layers: the badge (ours, removable on paid) and the
 * AI-content disclosure (the law, never removable). Styled ONLY from the
 * family tokens — this is the one place our chrome and a design family are
 * allowed to meet. It adds zero network; the offline posture holds.
 */
.dds-footer {
  display: flex;
  align-items: center;
  gap: var(--dds-space);
  padding: calc(var(--dds-space) * 0.75) var(--dds-space);
  color: color-mix(in srgb, var(--dds-ink) 70%, transparent);
  font-family: var(--dds-font-body);
  font-size: 0.75em;
  border-top: 1px solid color-mix(in srgb, var(--dds-ink) 20%, transparent);
  background: var(--dds-paper);
}

.dds-footer__badge {
  font-weight: 600;
  color: var(--dds-ink);
}

.dds-footer__disclosure {
  color: color-mix(in srgb, var(--dds-ink) 60%, transparent);
  margin-left: auto;
}


@media print {
  @page {
    size: 16in 9in;
    margin: 0;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #fff;
  }
  .dds-deck {
    display: block;
  }
  .dds-slide {
    min-height: 0;
    height: 9in;
    width: 16in;
    box-sizing: border-box;
    page-break-after: always;
    break-after: page;
    overflow: hidden;
    display: flex !important;
    align-items: center;
  }
  .dds-slide:last-child {
    page-break-after: auto;
    break-after: auto;
  }
  .dds-nav {
    display: none !important;
  }
  .dds-footer {
    display: none !important;
  }
  [data-reveal] {
    opacity: 1 !important;
    transform: none !important;
  }
}

</style>
</head>
<body>
<div class="dds-present">
<div class="dds-deck" style="--dds-family:editorial-serif" data-family="editorial-serif"><section class="dds-slide" aria-label="Aurora Roasters"><div class="dds-slide__inner"><div class="dds-region" data-role="headline" data-span="full" data-emphasis="primary"><span class="dds-text dds-text--headline" data-reveal="rise">Aurora Roasters</span></div><div class="dds-region" data-role="body" data-span="full"><span class="dds-text dds-text--body" data-reveal="rise">Single-origin coffee, roasted in small batches.</span></div><a class="dds-cta" href="https://example.com">Taste the difference</a></div></section><section class="dds-slide" aria-label="The roast"><div class="dds-slide__inner"><div class="dds-region" data-role="headline" data-span="full"><span class="dds-text dds-text--headline" data-reveal="rise">The roast</span></div><div class="dds-region" data-role="stats" data-span="full"><span class="dds-stat"><span class="dds-stat__value">48h</span><span class="dds-stat__label">slow roast</span></span><span class="dds-stat"><span class="dds-stat__value">92</span><span class="dds-stat__label">cupping score</span></span></div></div></section><section class="dds-slide" aria-label="From bean to cup"><div class="dds-slide__inner"><div class="dds-region" data-role="headline" data-span="full"><span class="dds-text dds-text--headline" data-reveal="rise">From bean to cup</span></div><div class="dds-region" data-role="quote" data-span="full"><span class="dds-quote"><span class="dds-quote__text">Coffee is a small ritual that makes the day yours.</span><span class="dds-quote__attr">— Aurora Roasters</span></span></div></div></section></div>
</div>
<footer class="dds-footer" data-ai-disclosure="true"><span class="dds-footer__badge">Designed by &lt;product&gt; from your brief</span><span class="dds-footer__disclosure">AI-generated content</span></footer>
<div class="dds-nav" aria-label="Slide navigation">
  <button id="dds-prev" aria-label="Previous slide">Prev</button>
  <span id="dds-counter">1 / 3</span>
  <button id="dds-next" aria-label="Next slide">Next</button>
</div>
<script>
(function () {
  var slides = Array.prototype.slice.call(document.querySelectorAll('.dds-slide'));
  var current = 0;
  var counter = document.getElementById('dds-counter');
  var prevBtn = document.getElementById('dds-prev');
  var nextBtn = document.getElementById('dds-next');

  function show(i) {
    current = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach(function (s, idx) {
      s.style.display = idx === current ? '' : 'none';
    });
    if (counter) counter.textContent = (current + 1) + ' / ' + slides.length;
  }

  function next() { show(current + 1); }
  function prev() { show(current - 1); }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === 'Home') { e.preventDefault(); show(0); }
    else if (e.key === 'End') { e.preventDefault(); show(slides.length - 1); }
  });

  var touchX = null;
  document.addEventListener('touchstart', function (e) { touchX = e.touches[0].clientX; });
  document.addEventListener('touchend', function (e) {
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 40) { dx < 0 ? next() : prev(); }
    touchX = null;
  });

  if (prevBtn) prevBtn.addEventListener('click', prev);
  if (nextBtn) nextBtn.addEventListener('click', next);

  show(0);
})();
</script>
</body>
</html>
