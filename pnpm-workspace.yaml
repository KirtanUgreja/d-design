# Two TypeScript packages, one lockfile. `render` exists because Python cannot
# server-side-render React (docs/techstack/backend.md) — a language boundary,
# not a security one, and the workspace is what lets it import the *same*
# renderer `web` ships rather than a copy of it.
packages:
  - web
  - render

# Every package allowed to run an install script, named one at a time.
#
# pnpm refuses to install while any is merely *ignored*, which reads as friction
# and is the right forcing function: an install script runs arbitrary code from
# a package author at install time, and it is the supply-chain step
# docs/coderules/dependencies.md spends its longest section on. Two lists rather
# than one, so "we decided this needs it" and "we decided this does not" are
# different statements instead of the same silence.
onlyBuiltDependencies:
  # Fetches its platform binary; blocked, the install succeeds and the package
  # is broken at runtime. Named in dependencies.md for exactly this.
  - esbuild
  # Same shape, and the ledger already carries it — a hardened image decoder
  # with a native build.
  - sharp

ignoredBuiltDependencies:
  # eslint's native resolver. It has run unbuilt for the whole project's life
  # and eslint is green, so it does not need the script — recorded here rather
  # than left as a warning nobody reads.
  - unrs-resolver

allowBuilds:
  esbuild: set this to true or false
  sharp: set this to true or false
  unrs-resolver: set this to true or false
