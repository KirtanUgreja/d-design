# The gate, on push and pull request. scripts/hooks/pre-commit is the local
# half; this catches a bypassed hook. No live model call runs here: the bench
# spends credits and is run by hand at phase exits (docs/v4/bench.md).
name: gate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: install
        run: uv sync --project api
      - name: browsers
        run: cd api && uv run playwright install --with-deps chromium firefox webkit
      - name: api — format, lint, types, tests
        env:
          DD_ENGINES: chromium,firefox,webkit
        run: |
          uv run --project api ruff format --check api
          uv run --project api ruff check api
          cd api && uv run mypy && uv run pytest -q
      - name: docs
        run: ./scripts/check-docs.sh
