# The gate, on push and pull request. scripts/hooks/pre-commit is the local
# half; this catches a bypassed hook. No live model call runs here: the bench
# spends credits and is run by hand at phase exits (docs/v4/bench.md).
name: gate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: install
        run: uv sync --project api
      - name: browsers
        run: cd api && uv run playwright install --with-deps chromium firefox webkit
      - name: api — format, lint, types, tests
        env:
          DD_ENGINES: chromium,firefox,webkit
        run: |
          uv run --project api ruff format --check api
          uv run --project api ruff check api
          cd api && uv run mypy && uv run pytest -q
      - name: docs
        run: ./scripts/check-docs.sh

  web:
    runs-on: ubuntu-latest
    # e2e/auth.spec.ts runs a real Better Auth; developers point it at an
    # auth_test database in web/.env.local, CI at this throwaway container.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: auth_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      AUTH_DATABASE_URL: postgres://postgres@localhost:5432/auth_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install
        run: cd web && pnpm install --frozen-lockfile
      - name: lint and types
        run: cd web && pnpm exec eslint . && pnpm exec tsc --noEmit
      - name: auth secret
        # Made per run, so no secret-shaped string lives in the repo.
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: auth tables
        run: cd web && pnpm dlx auth@1.7.7 migrate --config lib/auth.ts --yes
      - name: browsers
        run: cd web && pnpm exec playwright install --with-deps chromium firefox webkit
      - name: end to end, on recorded runs
        env:
          DD_ENGINES: chromium,firefox,webkit
        run: cd web && pnpm exec playwright test
