name: gate

on:
  push:
    branches: [main]
    # Scoped to the source trees on 2026-08-10, when the codebase was deleted.
    # Both jobs below `cd` into api/ and web/, so with no code every run fails
    # on a missing directory — a red badge that means "there is nothing here"
    # rather than "something broke". A path filter is the honest version: no
    # source touched, no gate to run. Delete these two `paths:` blocks the day
    # a source tree returns, or the gate silently stops guarding it.
    paths: ['api/**', 'web/**', '.github/workflows/**']
  pull_request:
    paths: ['api/**', 'web/**', '.github/workflows/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ddesign
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ddesign"
          --health-interval 2s --health-timeout 3s --health-retries 20
      # MinIO is NOT declared here. The official minio/minio image needs
      # `server /data` as a command argument (its default CMD is bare `minio`,
      # which just prints usage and exits) — verified by running it with no
      # args. `services:` only supports image/env/ports/options, and `options`
      # can add docker-create flags but not trailing positional args, so there
      # is no way to hand this image its required command through this block.
      # Started as an explicit step below instead, the same way
      # docker-compose.yml does it locally with `command: server /data`.
    env:
      DATABASE_URL: postgresql+asyncpg://app_user:app_user@localhost:5432/ddesign
      MIGRATION_DATABASE_URL: postgresql+asyncpg://migrator:migrator@localhost:5432/ddesign
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: d-design
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      LOCAL_USER_ID: 00000000-0000-4000-8000-000000000001
      # A real key, from repo secrets — the golden-brief eval and injection
      # corpus below make real, billed OpenRouter calls
      # (docs/v1/plan/06-model-seam-and-build.md -> "8. The five golden
      # briefs"). The seam's own unit tests never touch this: they mock the
      # HTTP call, so pytest above stays free and fast regardless of this
      # key's validity.
      #
      # openai/gpt-5-mini for all four phase slots. Verified live (2026-08):
      # anthropic/claude-haiku-4.5 rejects the Scene schema's structured-
      # output request outright ("compiled grammar is too large") regardless
      # of keyword-compatibility fixes — a real capability gap, not a config
      # problem. gpt-5-mini is also cheaper ($0.25/$2 per million tokens
      # in/out vs $1/$5) and OpenAI's structured-output implementation
      # handles this schema's size cleanly.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL_INTAKE: openai/gpt-5-mini
      OPENROUTER_MODEL_DIRECTOR: openai/gpt-5-mini
      OPENROUTER_MODEL_BUILD: openai/gpt-5-mini
      OPENROUTER_MODEL_EDIT: openai/gpt-5-mini
    steps:
      - uses: actions/checkout@v5

      # Same image, tag, and command as docker-compose.yml's minio service —
      # started early so it has the run of the setup steps below to become
      # healthy before pytest needs it.
      - name: start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do
            docker exec minio mc ready local && exit 0
            sleep 1
          done
          echo "::error::MinIO never became ready" && exit 1

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # web is needed for the schema check below — the chain has two ends and
      # CI is where it cannot be skipped with --no-verify.
      # `version:` pinned explicitly rather than left to auto-detect. The
      # action's own auto-detection reads a root package.json's
      # `packageManager` field, and this repo's is in web/package.json — a
      # subdirectory action-setup never looks in — which is why every run
      # failed with "No pnpm version is specified" until this was pinned.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v6
        with: { node-version: 26, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }

      # --frozen is not uv's default the way --frozen-lockfile is pnpm's.
      # A build that can resolve differently than the last one is not a build.
      - run: uv sync --frozen
        working-directory: api
      - run: pnpm install --frozen-lockfile
        working-directory: web

      - run: uv run ruff format --check .
        working-directory: api
      - run: uv run ruff check .
        working-directory: api
      - run: uv run mypy
        working-directory: api

      # THE step. Regenerate from Pydantic and fail on a diff — the same check
      # as the pre-commit gate, run again where it cannot be bypassed.
      - run: pnpm --silent schema:check
        working-directory: web

      - name: roles and migrations
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d ddesign -v ON_ERROR_STOP=1 \
            -f api/migrations/roles.sql
          cd api && uv run alembic upgrade head

      - name: create MinIO bucket
        # The bare "local" alias `mc ready` uses above is read-only enough for
        # a liveness check but not for `mb` — verified locally: `mb` against
        # unauthenticated "local" returns Access Denied. Root credentials via
        # an explicit alias are what a write actually needs.
        run: |
          docker exec minio mc alias set local http://localhost:9000 minioadmin minioadmin
          docker exec minio mc mb --ignore-existing local/d-design

      - run: uv run pytest -q
        working-directory: api

      # Structural assertions only — quality scoring is v2 and never gates a
      # merge (docs/techstack/ai-stack.md). Real money, real time: ~48
      # model calls (5 golden briefs + 7 injection payloads, several scenes
      # each) on gpt-5-mini.
      #
      # PYTHONPATH: `api/` is the Python project root, not a package
      # (AGENTS.md) — `evals/provider.py`'s `from lib.result import Err`
      # only resolves with `api/` on the path, and Promptfoo's Python worker
      # doesn't add the script's project root for you.
      # PROMPTFOO_PYTHON: must be the venv's interpreter, not whatever
      # bare `python3` resolves to on the runner — that one has none of
      # fastapi/pydantic/sqlalchemy/httpx installed.
      # Version pinned to what this workflow was verified against, the same
      # discipline as the pnpm/node versions above. No `--ci` flag: 0.122.0
      # has none (verified live — `promptfoo eval --ci` is `error: unknown
      # option`), and none is needed — a non-zero exit on any assertion
      # failure is `eval`'s default behavior, not something a flag turns on.
      # REQUEST_TIMEOUT_MS is what bounds a Promptfoo Python-worker call
      # (`getRequestTimeoutMs()`, default 3e5 = the 5 minutes that showed up
      # as "Python worker timed out after 300000ms"). One eval case here is
      # a whole build — several *sequential* model calls, and gpt-5-mini has
      # produced 12k-token scenes — so 5 minutes is simply below the real
      # cost of one case. 30 minutes is generous against an observed ~3-4
      # minute average, and the job's own 6h ceiling still bounds a hang.
      #
      # --max-concurrency 1 because the worker pool is one worker
      # (`workerCount = 1`); asking for 4 only queues 4 cases onto it.
      #
      # --output: the console table truncates each cell to ~60 characters, so
      # a failure shows the first line of a scene and never the assertion that
      # failed or the text that tripped it. Run 31010631635 cost a session of
      # guessing for exactly that reason. The JSON artifact is the whole
      # output plus every assertion's own reason, and `if: always()` is the
      # point of it — the run that needs reading is the run that just failed.
      - name: golden-brief + injection eval
        working-directory: api
        env:
          REQUEST_TIMEOUT_MS: '1800000'
        run: |
          PYTHONPATH="$PWD" PROMPTFOO_PYTHON="$PWD/.venv/bin/python3" \
            npx --yes promptfoo@0.122.0 eval -c promptfooconfig.yaml \
            --no-progress-bar --max-concurrency 1 \
            --output eval-results.json

      - name: eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: api/eval-results.json
          if-no-files-found: warn

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # version: pinned — see the api job above for why auto-detect fails here.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v6
        with: { node-version: 26, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec prettier --check .
        working-directory: web
      - run: pnpm exec eslint . --max-warnings 0
        working-directory: web
      - run: pnpm exec tsc --noEmit
        working-directory: web
      - run: pnpm exec vitest run
        working-directory: web
      - run: pnpm build
        working-directory: web
      # Explicit install, not a lifecycle script — the same discipline
      # dependencies.md asks for on every native-binary package. Only
      # chromium: the one browser project.name in playwright.config.ts uses.
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm test:e2e
        working-directory: web

  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/checks/invariants.sh
      - run: ./scripts/check-docs.sh

  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      # version: pinned — see the api job above for why auto-detect fails here.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v6
        with: { node-version: 26 }
      # Fails on a known-critical advisory in either tree. The attacker picks
      # the softer side, so neither is allowed to be the softer side.
      - run: pnpm install --frozen-lockfile && pnpm audit --audit-level critical
        working-directory: web
      - run: uvx pip-audit --strict --disable-pip -r <(uv export --frozen --no-dev --no-emit-project)
        working-directory: api
        shell: bash
