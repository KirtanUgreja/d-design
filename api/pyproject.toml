[project]
name = "d-design-api"
version = "0.1.0"
description = "The v1 pipeline: interview, mapping, slide builder, and the model seam"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest>=8.3",
    # sqlalchemy is a baseline dependency (docs/coderules/dependencies.md) but v1
    # has no database, so it is not a runtime dep yet. It is in dev so the
    # dormant tenant-wrapper in db/tenant.py typechecks; the async engine lands
    # with the DB in v3.
    "sqlalchemy[asyncio]>=2.0",
]

[tool.uv]
exclude-newer = "2026-08-12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
warn_unreachable = true
disallow_any_explicit = true
explicit_package_bases = true
mypy_path = "."
files = ["schema", "ai", "pipeline", "lib", "db", "migrations", "tests"]

[tool.ruff]
line-length = 100
src = ["."]
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ANN", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S", "D"]
