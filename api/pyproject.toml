[project]
name = "d-design-api"
version = "0.2.0"
description = "The v4 engine: a brief in, one offline HTML deck out"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "httpx>=0.27,<1",
    # Chromium for the bench wall now, and for QA, thumbnails and PDF from
    # phase 22 (docs/coderules/dependencies.md -> the ledger).
    "playwright>=1.47",
    "nh3>=0.3.6",
    "tinycss2>=1.5.1",
    "pillow>=12.3.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "pyjwt[crypto]>=2.13.0",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest>=8.3",
]

[tool.uv]
exclude-newer = "2026-08-12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
warn_unreachable = true
disallow_any_explicit = true
explicit_package_bases = true
mypy_path = "."
plugins = ["pydantic.mypy"]
files = ["engine", "benchtools", "lib", "store", "tests", "cli.py", "settings.py", "worker.py", "app.py", "ops.py", "migrations"]

[tool.ruff]
line-length = 100
src = ["."]
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ANN", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S", "D"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true

[[tool.mypy.overrides]]
module = ["tinycss2", "tinycss2.*"]
ignore_missing_imports = true
