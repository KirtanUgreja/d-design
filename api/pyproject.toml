[project]
name = "d-design-api"
version = "0.1.0"
description = "The v1 pipeline: interview, mapping, slide builder, and the model seam"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "httpx>=0.27,<1",
    # sqlalchemy + asyncpg are the database layer (docs/coderules/dependencies.md
    # baseline). They were dev-only in v1 (no database); the DB lands in v3
    # (phase 16) with accounts, so they become runtime deps here.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    # alembic owns the app tables' migrations (backend.md: Alembic for
    # everything except the auth tables, which drizzle-kit owns).
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest>=8.3",
]

[tool.uv]
exclude-newer = "2026-08-12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
warn_unreachable = true
disallow_any_explicit = true
explicit_package_bases = true
mypy_path = "."
files = ["schema", "ai", "pipeline", "lib", "db", "migrations", "tests"]

[tool.ruff]
line-length = 100
src = ["."]
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ANN", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S", "D"]
