[project]
name = "d-design-api"
version = "0.1.0"
description = "d-design api + jobs. One codebase, two entry points."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "pydantic>=2.13.4",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
    "httpx>=0.28.1",
    "boto3>=1.43.0",
    "pillow>=11.4.0",
    "defusedxml>=0.7.1",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pre-commit>=4.5.0",
    "boto3-stubs[s3]>=1.43.0",
    "types-defusedxml>=0.7.0.20260504",
]

# Not a distributable package — `api` and `jobs` are two entry points into this
# one tree, run from source in a container. No build backend to configure.
# ---------------------------------------------------------------------------
# Supply chain. pnpm gives both of these by default; uv gives neither, and a
# project hardened on one side only is not hardened.
# docs/coderules/dependencies.md -> "the same problem with worse defaults"
# ---------------------------------------------------------------------------
[tool.uv]
# The minimumReleaseAge equivalent. A fixed, reviewable date rather than a
# rolling window: bumping it is a diff someone reads. Nearly every registry
# compromise of the last two years was caught within hours, so a day of lag
# converts "first victim" into "read about it".
# Raise deliberately; a security patch is a logged exception, not a habit.
exclude-newer = "2026-08-03T00:00:00Z"
required-version = ">=0.11"
package = false

[tool.mypy]
strict = true
warn_unreachable = true
disallow_any_explicit = true          # `Any` is a decision, not a shrug
plugins = ["pydantic.mypy"]
files = ["."]
exclude = "^(\\.venv|migrations/versions)/"

[tool.pydantic-mypy]
# `init_typed` is what makes disallow_any_explicit survivable: without it the
# plugin synthesizes `__init__(**data: Any)` on every model and every schema
# class is an error. With it, the generated signature uses the real field
# types — which is stricter, not a workaround.
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["pgqueuer.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # flake8-bugbear
    "ANN",           # flake8-annotations - full annotations (coderules/python.md)
    "TID",           # flake8-tidy-imports - TID252 relative-import ban
    "UP",            # pyupgrade
    "S",             # flake8-bandit - S301 pickle, S506 yaml.load, and friends
    "RUF",
]
ignore = [
    "E501",          # line length is the formatter's job, not the linter's
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# pytest is assert. Both patterns: api/tests/ for cross-cutting tests, and
# test_*.py colocated next to the module it tests (docs/coderules/structure.md
# -> "Colocate").
"tests/*" = ["S101"]
"**/test_*.py" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One loop for the whole run. The engine and its connection pool are process
# lifetime objects in production, and a loop per test means asyncpg connections
# outliving the loop that created them — which fails in a way that looks like a
# pool bug and is not one.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Not "tests" only. Tests colocate with the module they test
# (docs/coderules/structure.md -> "Colocate") — api/schema/test_scene.py sits
# next to schema/scene.py, and api/tests/ holds what is cross-cutting rather
# than owned by one feature. `testpaths = ["tests"]` would silently stop
# collecting the colocated ones; the default (search from rootdir) picks up
# both without needing a list that has to be kept in sync with every new
# feature directory.
# `api/` is the project root, not an installed package — the same reason
# scripts run as `python -m`. This puts the top-level modules on the path.
pythonpath = ["."]
