# Alembic config for api (v3, phase 16).
#
# Migrates the APP tables only. The auth tables (user, session, account,
# verification, organization, member, invitation) are owned by web's Drizzle
# adapter and are excluded here via migrations/env.py's include_object — the
# single most destructive failure mode in the architecture is an autogenerate
# run proposing to drop them, and that filter is what prevents it
# (docs/techstack/backend.md -> "Two ORMs, one database").
[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = postgresql+asyncpg://ddesign:ddesign@localhost:5432/ddesign

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
