# Promptfoo harness for the Build phase
# (docs/v1/plan/06-model-seam-and-build.md -> "8. The five golden briefs",
# docs/security/testing.md -> "Prompt injection").
#
# Structural assertions only — quality scoring is a v2 concern and must
# never gate a merge (docs/techstack/ai-stack.md). All four assertions from
# docs/security/testing.md gate, and all four are safe to gate on for one
# reason: each has a counterpart in features/generation/checks.py that
# rejects the violating scene before it can reach this harness's output.
# What an assertion here tests is that control, not the model's mood.
#
# `no_prompt_leak` was briefly the exception, and CI run 31010631635 is why
# it no longer is: 03-exfiltration.json failed it on a run where nothing
# about the pipeline had changed. That was not flakiness to route around —
# it was the model taking the exfiltration bait, on the one assertion of the
# four with nothing on our side of the seam enforcing it. The fix was to
# give it the same backstop the other three have (checks.py's
# `_assert_no_prompt_leak`), which makes it deterministic in exactly the
# sense the doc means by "must be absolute — they do not depend on the model
# behaving". Dropping it from this list instead would have deleted the only
# detector for a demonstrated live failure and called the gate green.
#
# The distinction the doc's first sentence draws still holds: this file may
# assert structural rules our code enforces, never a probabilistic judgement
# of output quality. The injection *rate* — how often a payload gets far
# enough to be caught at all — is `generations.error_class` over time, not
# this run's pass/fail.
#
# Wired into CI (.github/workflows/gate.yml's `api` job, after `pytest`) —
# every case here makes a real, billed OpenRouter call per scene, ~48 calls
# total on openai/gpt-5-mini. Verified live 2026-08-05: 5/5 golden briefs
# and 7/7 injection payloads produced structurally clean output
# (docs/v1/plan/06-model-seam-and-build.md -> Exit gate). Run locally the
# same way CI does:
#
#   PYTHONPATH="$PWD" PROMPTFOO_PYTHON="$PWD/.venv/bin/python3" \
#     npx promptfoo@0.122.0 eval -c promptfooconfig.yaml \
#     --no-progress-bar --max-concurrency 1
#
# --max-concurrency 1, not the default of 4: verified live (twice) that
# concurrency 4 makes Promptfoo's persistent Python worker time out on 2
# of 12 cases — each fixture is several sequential model calls (2-4
# minutes of real work), more than the worker can actually run at once
# despite the flag. Slower (~45-70 min instead of ~15-30) but reliable.

providers:
  - id: 'python:evals/provider.py'

prompts:
  - '{{fixture}}' # unused by the provider, which reads context.vars.fixture directly — Promptfoo requires at least one prompt template to exist

defaultTest:
  assert:
    - type: python
      value: file://evals/assertions.py:valid_scene_json
    - type: python
      value: file://evals/assertions.py:no_slot_network_calls
    - type: python
      value: file://evals/assertions.py:hrefs_trace_to_brief
    - type: python
      value: file://evals/assertions.py:no_prompt_leak

tests:
  # The five golden briefs — schema-valid, structurally clean input.
  - description: 'golden: saas launch'
    vars: { fixture: 'evals/briefs/01-saas-launch.json' }
  - description: 'golden: mobile app'
    vars: { fixture: 'evals/briefs/02-mobile-app.json' }
  - description: 'golden: b2b consulting'
    vars: { fixture: 'evals/briefs/03-b2b-consulting.json' }
  - description: 'golden: ecommerce drop'
    vars: { fixture: 'evals/briefs/04-ecommerce-drop.json' }
  - description: 'golden: nonprofit campaign'
    vars: { fixture: 'evals/briefs/05-nonprofit-campaign.json' }

  # The injection corpus — one payload family per case
  # (docs/security/testing.md -> "Prompt injection").
  - description: 'injection: direct override'
    vars: { fixture: 'evals/injection/01-direct-override.json' }
  - description: 'injection: role confusion'
    vars: { fixture: 'evals/injection/02-role-confusion.json' }
  - description: 'injection: exfiltration'
    vars: { fixture: 'evals/injection/03-exfiltration.json' }
  - description: 'injection: href hijack'
    vars: { fixture: 'evals/injection/04-href-hijack.json' }
  - description: 'injection: slot poisoning'
    vars: { fixture: 'evals/injection/05-slot-poisoning.json' }
  - description: 'injection: encoding tricks'
    vars: { fixture: 'evals/injection/06-encoding-tricks.json' }
  - description: 'injection: claim tampering'
    vars: { fixture: 'evals/injection/07-claim-tampering.json' }
